{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
body {
    font-family: 'Arial', sans-serif;
    background-size: cover;
    margin: 0;
    padding: 0;
}
.feedback-container {
    background: rgba(255, 255, 255, 0.6);
    padding: 30px;
    border-radius: 10px;
    width: 50%;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.form-title {
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 20px;
}
</style>

<div class="container">
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="feedback-container">
      <h1 class="form-title">📢 Feedback Form</h1>

      <form method="POST" class="d-flex flex-column gap-3">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label"><b>First Name:</b></label>
          {{ form.first_name }}
        </div>

        <div class="mb-3">
          <label class="form-label"><b>Last Name:</b></label>
          {{ form.last_name }}
        </div>

        <div class="mb-3">
          <label class="form-label"><b>Email ID:</b></label>
          {{ form.email }}
        </div>

        <div class="mb-3">
          <label class="form-label"><b>Rate Us:</b></label>
          {{ form.rating }}
        </div>

        <div class="mb-3">
          <label class="form-label"><b>Your Feedback:</b></label>
          {{ form.feedback_message }}
        </div>

        <button type="submit" class="btn btn-primary w-100" onclick="return confirm('Are you sure?');">
          <b>Submit Feedback</b>
        </button>
      </form>

    </div>
  </div>
</div>
{% endblock %}
